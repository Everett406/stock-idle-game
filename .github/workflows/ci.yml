name: CI

# 推送到 main 时自动构建 Debug APK，用于快速回归验证
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Runner 自带 Android SDK（ANDROID_HOME 已预置，许可证已接受）；
      # 若缺组件由 AGP 自动下载，此处仅兜底确认许可证
      - name: Ensure Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: stockidle-debug
          path: app/build/outputs/apk/debug/app-debug.apk
